<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROKA Cashier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,600;1,6..72,500&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Static, GitHub-Pages-friendly build. Layout: sticky header, scrollable drink grid grouped by
     section, sticky order bar that opens a cart sheet. A second "Admin" view (toggled by #admin in
     the URL, no page reload) shows totals, an item breakdown, and an order log — all read from this
     same browser's localStorage. There is no backend here, so Admin only ever sees orders rung up
     on THIS device; it will not show orders from any other phone or computer running this page. */
  :root{
    --bg:#FBF7EE; --surface:#FFFFFF; --surface-2:#F3EEE1; --fg:#17301F; --muted:#6E6A58;
    --accent:#E2872E; --accent-fg:#17301F; --line:#E4DECB; --danger:#B4452F; --good:#3E7A4C;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121A15; --surface:#1B261F; --surface-2:#223027; --fg:#F3EFE2; --muted:#9FAA98;
      --accent:#E8984A; --accent-fg:#17301F; --line:#30402F; --danger:#E27A62; --good:#6FBF82;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121A15; --surface:#1B261F; --surface-2:#223027; --fg:#F3EFE2; --muted:#9FAA98;
    --accent:#E8984A; --accent-fg:#17301F; --line:#30402F; --danger:#E27A62; --good:#6FBF82;
    color-scheme: dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:'Karla',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
    display:flex; flex-direction:column;
  }
  h1,h2,h3{font-family:'Newsreader',serif; font-weight:600; margin:0}
  .num{font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}

  header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
    background:var(--fg); color:var(--bg);
    padding:14px 18px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  header .brand{display:flex; align-items:baseline; gap:8px}
  header .brand h1{font-size:19px; letter-spacing:0.02em}
  header .brand span{font-family:'Newsreader',serif; font-style:italic; font-size:12px; color:var(--accent)}
  header .hbtns{display:flex; gap:8px}
  header button{
    background:transparent; border:1.5px solid rgba(251,247,238,0.35); color:var(--bg);
    font-family:'Karla',sans-serif; font-weight:600; font-size:12.5px; letter-spacing:0.02em;
    padding:7px 12px; border-radius:8px; cursor:pointer;
  }
  header button:active{background:rgba(251,247,238,0.12)}
  header a.navlink{
    color:var(--bg); text-decoration:none; font-size:12.5px; font-weight:700;
    border:1.5px solid rgba(251,247,238,0.35); padding:7px 12px; border-radius:8px;
  }

  main{flex:1 1 auto; padding:16px 16px 140px; max-width:720px; width:100%; margin:0 auto}
  main.admin-main{padding-bottom:40px; max-width:820px}

  /* ---- Cashier view ---- */
  .section-title{
    font-family:'Karla',sans-serif; font-weight:800; font-size:12px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--muted); margin:22px 2px 10px;
  }
  .section-title:first-child{margin-top:4px}

  .grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
  @media (min-width:560px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }

  .drink-btn{
    appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--fg);
    border-radius:14px; padding:14px 12px; text-align:left; cursor:pointer;
    display:flex; flex-direction:column; gap:10px; min-height:92px;
    font-family:'Karla',sans-serif; position:relative; transition:transform .08s ease, border-color .08s ease;
  }
  .drink-btn:active{transform:scale(0.97); border-color:var(--accent)}
  .drink-btn .name{font-weight:700; font-size:14.5px; line-height:1.25}
  .drink-btn .price{font-weight:800; font-size:15px; color:var(--accent)}
  .drink-btn .qty-badge{
    position:absolute; top:-8px; right:-8px; background:var(--accent); color:var(--accent-fg);
    font-weight:800; font-size:12.5px; min-width:24px; height:24px; border-radius:999px;
    display:flex; align-items:center; justify-content:center; padding:0 6px;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }

  .sync-note{
    margin:14px 2px 0; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:7px;
  }
  .dot{width:7px; height:7px; border-radius:999px; background:var(--muted); flex:0 0 auto}
  .dot.live{background:var(--good)}
  .dot.off{background:var(--danger)}

  .order-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--fg); color:var(--bg);
    display:flex; align-items:center; gap:14px;
    box-shadow:0 -6px 20px rgba(0,0,0,0.18);
  }
  .order-bar .info{flex:1 1 auto; min-width:0}
  .order-bar .count{font-size:12px; color:var(--accent); font-weight:700; letter-spacing:0.04em; text-transform:uppercase}
  .order-bar .total{font-family:'Newsreader',serif; font-weight:600; font-size:22px}
  .order-bar button{
    appearance:none; border:none; background:var(--accent); color:var(--accent-fg);
    font-family:'Karla',sans-serif; font-weight:800; font-size:14.5px;
    padding:13px 20px; border-radius:11px; cursor:pointer; white-space:nowrap;
  }
  .order-bar button:disabled{opacity:0.4}
  .order-bar button:active:not(:disabled){transform:scale(0.97)}

  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(10,14,11,0.5); z-index:20;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:var(--bg); color:var(--fg); width:100%; max-width:560px;
    border-radius:18px 18px 0 0; max-height:88vh; display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:18px 18px 12px; border-bottom:1px solid var(--line);
  }
  .sheet-head h2{font-size:19px}
  .sheet-head button{
    appearance:none; border:none; background:var(--surface-2); color:var(--fg);
    width:32px; height:32px; border-radius:999px; font-size:16px; cursor:pointer;
  }
  .sheet-body{overflow-y:auto; padding:10px 18px 4px; flex:1 1 auto}
  .line{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line)}
  .line .ln-name{flex:1 1 auto; min-width:0}
  .line .ln-name .t{font-weight:700; font-size:14px}
  .line .ln-name .p{font-size:12.5px; color:var(--muted)}
  .stepper{display:flex; align-items:center; gap:8px}
  .stepper button{
    appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--fg);
    width:30px; height:30px; border-radius:8px; font-size:16px; font-weight:700; cursor:pointer; line-height:1;
  }
  .stepper button:active{background:var(--surface-2)}
  .stepper .qv{min-width:18px; text-align:center; font-weight:700; font-size:14px}
  .ln-sub{width:62px; text-align:right; font-weight:700; font-size:14px}
  .empty-cart{padding:36px 10px; text-align:center; color:var(--muted); font-size:14px}

  .sheet-foot{padding:14px 18px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
  .row{display:flex; justify-content:space-between; align-items:center; font-size:14px}
  .row.grand{font-family:'Newsreader',serif; font-weight:600; font-size:21px; padding-top:2px}
  .cash-row{display:flex; align-items:center; gap:10px; margin-top:4px}
  .cash-row label{font-size:12.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; width:76px}
  .cash-row input{
    flex:1 1 auto; border:1px solid var(--line); background:var(--surface); color:var(--fg);
    border-radius:9px; padding:10px 12px; font-size:15px; font-family:'Karla',sans-serif; min-width:0;
  }
  .cash-row input:focus{outline:2px solid var(--accent); outline-offset:1px}
  .change-note{font-size:12.5px; color:var(--muted)}
  .change-note.ready{color:var(--accent); font-weight:700}
  .foot-actions{display:flex; gap:10px; margin-top:4px}
  .btn{
    appearance:none; border:none; border-radius:11px; padding:13px 16px; font-weight:800; font-size:14.5px;
    font-family:'Karla',sans-serif; cursor:pointer; flex:1 1 auto;
  }
  .btn:active{transform:scale(0.98)}
  .btn-primary{background:var(--accent); color:var(--accent-fg)}
  .btn-primary:disabled{opacity:0.4}
  .btn-ghost{background:transparent; color:var(--danger); border:1.5px solid var(--line); flex:0 0 auto}

  .confirm{position:fixed; inset:0; background:rgba(10,14,11,0.55); z-index:30; display:flex; align-items:center; justify-content:center; padding:24px}
  .confirm-box{
    background:var(--surface); color:var(--fg); border-radius:16px; padding:22px; max-width:320px; width:100%;
    display:flex; flex-direction:column; gap:14px; text-align:center;
  }
  .confirm-box p{margin:0; font-size:14.5px; color:var(--muted)}
  .confirm-box .actions{display:flex; gap:10px}

  /* ---- Admin view ---- */
  .day-tabs{display:flex; gap:8px; overflow-x:auto; padding:14px 2px 0; -webkit-overflow-scrolling:touch}
  .day-tab{
    appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--fg);
    font-family:'Karla',sans-serif; font-weight:700; font-size:13px; padding:8px 14px; border-radius:999px;
    cursor:pointer; white-space:nowrap; flex:0 0 auto;
  }
  .day-tab.active{background:var(--fg); color:var(--bg); border-color:var(--fg)}

  .export-row{margin-top:12px}
  .btn-export{
    appearance:none; border:1.5px solid var(--accent); background:transparent; color:var(--accent);
    font-family:'Karla',sans-serif; font-weight:700; font-size:13px; padding:9px 14px; border-radius:10px; cursor:pointer;
  }
  .btn-export:active{background:var(--accent); color:var(--accent-fg)}
  .btn-export:disabled{opacity:0.4; cursor:default}

  .day-row{
    appearance:none; width:100%; border:none; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; display:flex; align-items:center; gap:10px; cursor:pointer; text-align:left;
    font-family:'Karla',sans-serif; color:var(--fg);
  }
  .day-row .dr-date{font-weight:700; font-size:14px; flex:0 0 auto; width:76px}
  .day-row .dr-sub{flex:1 1 auto; min-width:0; font-size:12.5px; color:var(--muted)}
  .day-row .dr-total{font-weight:800; font-size:14.5px; color:var(--accent)}

  .stat-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:16px}
  @media (min-width:640px){ .stat-grid{grid-template-columns:repeat(4,minmax(0,1fr))} }
  .stat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px;
    display:flex; flex-direction:column; gap:4px;
  }
  .stat-card .label{font-size:11.5px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted)}
  .stat-card .value{font-family:'Newsreader',serif; font-weight:600; font-size:26px}
  .stat-card .sub{font-size:12px; color:var(--muted)}

  .admin-section{margin-top:28px}
  .admin-section .section-title{margin:0 2px 10px}

  .breakdown-row{
    display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line);
  }
  .breakdown-row .bname{flex:1 1 auto; min-width:0; font-size:14px; font-weight:600}
  .breakdown-row .bbar-wrap{flex:1 1 140px; min-width:60px; height:7px; background:var(--surface-2); border-radius:999px; overflow:hidden}
  .breakdown-row .bbar{height:100%; background:var(--accent); border-radius:999px}
  .breakdown-row .bqty{width:34px; text-align:right; font-weight:700; font-size:13.5px}
  .breakdown-row .brev{width:72px; text-align:right; font-size:13px; color:var(--muted)}

  .order-log{display:flex; flex-direction:column; gap:8px}
  .order-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  }
  .order-card .oc-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
  .order-card .oc-time{font-size:12px; color:var(--muted)}
  .order-card .oc-total{font-weight:800; font-size:15px; color:var(--accent)}
  .order-card .oc-items{font-size:13px; color:var(--muted); margin-top:4px}
  .order-card .oc-cash{font-size:12px; color:var(--muted); margin-top:4px}
  .empty-log{padding:30px 10px; text-align:center; color:var(--muted); font-size:14px}

  .admin-note{font-size:13px; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:16px}

  /* ---- Payment method toggle + GCash QR (cashier sheet) ---- */
  .pay-toggle{display:flex; gap:8px; margin-top:4px}
  .pay-btn{
    flex:1 1 auto; appearance:none; border:1.5px solid var(--line); background:var(--surface); color:var(--fg);
    font-family:'Karla',sans-serif; font-weight:700; font-size:13.5px; padding:10px 8px; border-radius:10px; cursor:pointer;
  }
  .pay-btn.active{background:var(--fg); color:var(--bg); border-color:var(--fg)}
  .gcash-box{
    display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 10px 6px; text-align:center;
  }
  .gcash-box img{width:150px; height:150px; border-radius:12px; border:1px solid var(--line); object-fit:contain; background:#fff}
  .gcash-box .gc-note{font-size:12.5px; color:var(--muted)}

  /* ---- Admin PIN gate ---- */
  .pin-gate{display:flex; flex-direction:column; align-items:center; gap:14px; padding:60px 20px; text-align:center}
  .pin-gate h2{font-size:19px}
  .pin-gate p{margin:0; font-size:13.5px; color:var(--muted); max-width:280px}
  .pin-gate input{
    border:1.5px solid var(--line); background:var(--surface); color:var(--fg); text-align:center;
    font-family:'Karla',sans-serif; font-weight:700; font-size:22px; letter-spacing:0.3em;
    border-radius:10px; padding:12px 14px; width:160px;
  }
  .pin-gate input:focus{outline:2px solid var(--accent); outline-offset:1px}
  .pin-gate .pin-err{font-size:12.5px; color:var(--danger); min-height:16px}
  .pin-gate button{
    appearance:none; border:none; background:var(--accent); color:var(--accent-fg);
    font-family:'Karla',sans-serif; font-weight:800; font-size:14px; padding:12px 26px; border-radius:11px; cursor:pointer;
  }

  /* ---- Sync queue note ---- */
  .sync-note.pending{color:var(--accent); font-weight:700}
</style>
</head>
<body>

<header>
  <div class="brand"><h1 id="brandTitle">ROKA</h1><span id="brandSub">Pop-Up Cashier</span></div>
  <div class="hbtns">
    <a class="navlink" id="navLink" href="#admin">Admin view</a>
    <button id="clearBtn" type="button" hidden>Clear order</button>
  </div>
</header>

<main id="cashierMain"></main>
<main id="adminMain" class="admin-main" hidden></main>

<div class="order-bar" id="orderBar">
  <div class="info">
    <div class="count" id="barCount">0 items</div>
    <div class="total num" id="barTotal">&#8369;0</div>
  </div>
  <button id="viewOrderBtn" type="button" disabled>View order</button>
</div>

<div id="sheetRoot"></div>
<div id="confirmRoot"></div>

<script>
(function(){
  "use strict";

  var MENU = [
    { id:'matcha-latte', name:'Matcha Latte', price:188, section:'Matcha' },
    { id:'matcha-seasalt', name:'Matcha Sea Salt', price:188, section:'Matcha' },
    { id:'coco-matcha', name:'Coco Matcha Cloud', price:188, section:'Matcha' },
    { id:'earl-grey', name:'Earl Grey Matcha', price:198, section:'Matcha' },
    { id:'strawberry-matcha', name:'Strawberry Matcha', price:198, section:'Matcha' },
    { id:'hojicha-latte', name:'Hojicha Latte', price:178, section:'Hojicha' },
    { id:'hojicha-seasalt', name:'Hojicha Sea Salt', price:178, section:'Hojicha' },
    { id:'tablea-seasalt', name:'Tablea Sea Salt Cloud', price:158, section:'Tablea' },
    { id:'tablea-calamansi', name:'Tablea Calamansi', price:158, section:'Tablea' }
  ];
  var MENU_BY_ID = {};
  MENU.forEach(function(it){ MENU_BY_ID[it.id] = it; });
  var SECTIONS = ['Matcha','Hojicha','Tablea'];
  var STORE_KEY = 'roka_cashier_order_v1';

  function peso(n){ return '₱' + Math.round(n).toLocaleString('en-PH'); }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // ---------------- order log (this device/browser only — no cross-device sync) ----------------
  // GitHub Pages is a static site with no backend, so there's nothing to sync to. The cashier and
  // the Admin tab are the SAME page, and both read/write this one localStorage array. That means
  // Admin only ever shows orders rung up in THIS browser, on THIS phone/computer — not orders from
  // any other device. If you run the cashier on two phones, each phone has its own separate log.
  var ORDERS_KEY = 'roka_orders_v1';
  function loadOrders(){
    try{
      var raw = localStorage.getItem(ORDERS_KEY);
      if(!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){ return []; }
  }
  function saveOrders(list){ try{ localStorage.setItem(ORDERS_KEY, JSON.stringify(list)); }catch(e){} }
  function addOrder(orderData){
    var list = loadOrders();
    list.push(orderData);
    saveOrders(list);
  }

  // ---------------- Google Sheet sync (best-effort, with a retry queue) ----------------
  // Each completed order is also POSTed to a Google Apps Script Web App bound to the Sales
  // Tracker sheet, which appends one row. This runs in the viewer's own browser (not Claude's
  // sandbox), so it reaches script.google.com fine. If it's offline or the post fails, the order
  // is queued in localStorage and retried automatically — it's never silently dropped, and it's
  // never double-sent (each queued entry is removed only after a confirmed ok:true response).
  var SHEET_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbx92KxcBVYVj2YqhBRx1DZhfdRu7QsvuTjgqeMWATBqXblLiO8aWPTgqFSHtuElBA/exec';
  var SHEET_QUEUE_KEY = 'roka_sheet_queue_v1';

  function loadSheetQueue(){
    try{
      var raw = localStorage.getItem(SHEET_QUEUE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){ return []; }
  }
  function saveSheetQueue(q){ try{ localStorage.setItem(SHEET_QUEUE_KEY, JSON.stringify(q)); }catch(e){} }
  var sheetQueue = loadSheetQueue();
  var flushingSheetQueue = false;

  function sendToSheet(orderData){
    if(!SHEET_WEBHOOK_URL){ return; }
    sheetQueue.push(orderData);
    saveSheetQueue(sheetQueue);
    updateSyncNote();
    flushSheetQueue();
  }

  function flushSheetQueue(){
    if(flushingSheetQueue || !SHEET_WEBHOOK_URL) return;
    if(sheetQueue.length === 0) return;
    flushingSheetQueue = true;
    var entry = sheetQueue[0];
    // text/plain avoids a CORS preflight that Apps Script web apps don't handle; the script
    // still JSON.parses the body itself.
    fetch(SHEET_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(entry)
    }).then(function(res){ return res.json().catch(function(){ return {ok:true}; }); })
      .then(function(json){
        if(json && json.ok === false) throw new Error(json.error || 'sheet rejected');
        sheetQueue.shift();
        saveSheetQueue(sheetQueue);
        flushingSheetQueue = false;
        updateSyncNote();
        if(sheetQueue.length) flushSheetQueue();
      })
      .catch(function(){
        // Offline, blocked, or the script errored — leave it queued and try again later.
        flushingSheetQueue = false;
        updateSyncNote();
      });
  }
  // Retry periodically in case connectivity comes back without a new order triggering it.
  setInterval(flushSheetQueue, 20000);
  window.addEventListener('online', flushSheetQueue);

  function updateSyncNote(){
    var el = document.getElementById('syncDot');
    var txt = document.getElementById('syncText');
    if(!el) return;
    if(SHEET_WEBHOOK_URL && sheetQueue.length > 0){
      el.className = 'dot off';
      txt.parentNode.className = 'sync-note pending';
      txt.textContent = sheetQueue.length + ' order' + (sheetQueue.length===1?'':'s') + ' waiting to reach the Sheet';
      return;
    }
    txt.parentNode.className = 'sync-note';
    el.className = 'dot live';
    txt.textContent = SHEET_WEBHOOK_URL ? 'Saved here + synced to Sheet' : 'Saved on this device';
  }

  // ---------------- cashier state ----------------
  function loadCart(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return {};
      var parsed = JSON.parse(raw);
      return (parsed && typeof parsed === 'object') ? parsed : {};
    }catch(e){ return {}; }
  }
  function saveCart(cart){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(cart)); }catch(e){} }

  var cart = loadCart();
  var sheetOpen = false;
  var cashValue = '';

  var cashierMain = document.getElementById('cashierMain');
  var barCount = document.getElementById('barCount');
  var barTotal = document.getElementById('barTotal');
  var viewOrderBtn = document.getElementById('viewOrderBtn');
  var sheetRoot = document.getElementById('sheetRoot');
  var confirmRoot = document.getElementById('confirmRoot');

  function itemCount(){ var n=0; for(var k in cart){ n += cart[k]; } return n; }
  function cartTotal(){ var sum=0; MENU.forEach(function(it){ if(cart[it.id]) sum += it.price*cart[it.id]; }); return sum; }

  function addItem(id){ cart[id] = (cart[id]||0)+1; saveCart(cart); renderCashier(); }
  function setQty(id, qty){ if(qty<=0) delete cart[id]; else cart[id]=qty; saveCart(cart); renderCashier(); }

  function renderMenu(){
    var html = '<div class="sync-note"><span class="dot" id="syncDot"></span><span id="syncText">Checking sync&hellip;</span></div>';
    SECTIONS.forEach(function(sec){
      html += '<div class="section-title">' + sec + '</div><div class="grid">';
      MENU.filter(function(it){ return it.section===sec; }).forEach(function(it){
        var qty = cart[it.id] || 0;
        html += '' +
          '<button class="drink-btn" type="button" data-add="' + it.id + '" aria-label="Add ' + esc(it.name) + ', ' + peso(it.price) + '">' +
            (qty>0 ? '<span class="qty-badge">' + qty + '</span>' : '') +
            '<span class="name">' + esc(it.name) + '</span>' +
            '<span class="price num">' + peso(it.price) + '</span>' +
          '</button>';
      });
      html += '</div>';
    });
    cashierMain.innerHTML = html;
    updateSyncNote();
  }

  function renderBar(){
    var n = itemCount();
    barCount.textContent = n===1 ? '1 item' : n+' items';
    barTotal.textContent = peso(cartTotal());
    viewOrderBtn.disabled = n===0;
  }

              '<button type="button" data-dec="' + it.id + '" aria-label="Remove one ' + esc(it.name) + '">&minus;</button>' +
              '<span class="qv num">' + qty + '</span>' +
              '<button type="button" data-inc="' + it.id + '" aria-label="Add one ' + esc(it.name) + '">+</button>' +
            '</div>' +
            '<div class="ln-sub num">' + peso(it.price*qty) + '</div>' +
          '</div>';
      });
    }

    var changeNote;
    if(!hasCash) changeNote = '<div class="change-note">Enter cash received to compute change.</div>';
    else if(change<0) changeNote = '<div class="change-note">Short by ' + peso(Math.abs(change)) + '.</div>';
    else changeNote = '<div class="change-note ready">Change: ' + peso(change) + '</div>';

    var payToggle = '' +
      '<div class="pay-toggle">' +
        '<button type="button" class="pay-btn' + (paymentMethod==='cash'?' active':'') + '" data-pay="cash">Cash</button>' +
        '<button type="button" class="pay-btn' + (paymentMethod==='gcash'?' active':'') + '" data-pay="gcash">GCash</button>' +
      '</div>';

    var paySection = paymentMethod === 'gcash'
      ? '<div class="gcash-box"><img src="' + GCASH_QR_SRC + '" alt="GCash QR code"><div class="gc-note">Show this to the customer to scan &amp; pay ' + peso(total) + '</div></div>'
      : '' +
        '<div class="cash-row"><label for="cashInput">Cash</label>' +
          '<input id="cashInput" type="number" inputmode="decimal" min="0" step="1" placeholder="0" value="' + esc(cashValue||'') + '"></div>' +
        changeNote;

    sheetRoot.innerHTML = '' +
      '<div class="sheet-backdrop" id="sheetBackdrop">' +
        '<div class="sheet" role="dialog" aria-label="Current order">' +
          '<div class="sheet-head"><h2>Current order</h2><button type="button" id="sheetClose" aria-label="Close">&times;</button></div>' +
          '<div class="sheet-body">' + body + '</div>' +
          '<div class="sheet-foot">' +
            '<div class="row grand"><span>Total</span><span class="num">' + peso(total) + '</span></div>' +
            payToggle +
            paySection +
            '<div class="foot-actions">' +
              '<button type="button" class="btn btn-ghost" id="cancelOrderBtn">Clear</button>' +
              '<button type="button" class="btn btn-primary" id="doneOrderBtn"' + (lines.length===0?' disabled':'') + '>Order done</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('sheetBackdrop').addEventListener('click', function(e){ if(e.target.id==='sheetBackdrop'){ sheetOpen=false; renderSheet(); } });
    document.getElementById('sheetClose').addEventListener('click', function(){ sheetOpen=false; renderSheet(); });
    document.getElementById('cancelOrderBtn').addEventListener('click', function(){ openConfirm('clear'); });
    document.getElementById('doneOrderBtn').addEventListener('click', function(){ openConfirm('new-order'); });

    sheetRoot.querySelectorAll('[data-pay]').forEach(function(btn){
      btn.addEventListener('click', function(){ paymentMethod = btn.getAttribute('data-pay'); renderSheet(); });
    });

    var cashInput = document.getElementById('cashInput');
    if(cashInput){
      cashInput.addEventListener('input', function(){
        cashValue = cashInput.value;
        var cn = document.querySelector('.change-note');
        var cNum = parseFloat(cashValue);
        var has = cashValue.trim()!=='' && !isNaN(cNum);
        var ch = has ? (cNum-total) : null;
        if(cn){
          cn.className = 'change-note' + (has && ch>=0 ? ' ready' : '');
          cn.textContent = !has ? 'Enter cash received to compute change.' : (ch<0 ? 'Short by ' + peso(Math.abs(ch)) + '.' : 'Change: ' + peso(ch));
        }
      });
    }

    sheetRoot.querySelectorAll('[data-inc]').forEach(function(btn){
      btn.addEventListener('click', function(){ var id=btn.getAttribute('data-inc'); setQty(id,(cart[id]||0)+1); });
    });
    sheetRoot.querySelectorAll('[data-dec]').forEach(function(btn){
      btn.addEventListener('click', function(){ var id=btn.getAttribute('data-dec'); setQty(id,(cart[id]||0)-1); });
    });
  }

  function openConfirm(kind){
    pendingConfirm = kind;
    var label = kind==='clear' ? 'Clear this order?' : 'Mark order done?';
    var sub = kind==='clear'
      ? 'This removes every drink currently added.'
      : 'This logs the order and clears the cart for the next customer.';
    confirmRoot.innerHTML = '' +
      '<div class="confirm" id="confirmBackdrop">' +
        '<div class="confirm-box">' +
          '<h2>' + label + '</h2>' +
          '<p>' + sub + '</p>' +
          '<div class="actions">' +
            '<button type="button" class="btn btn-ghost" id="confirmNo" style="color:var(--fg)">Back</button>' +
            '<button type="button" class="btn btn-primary" id="confirmYes">Yes</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('confirmBackdrop').addEventListener('click', function(e){ if(e.target.id==='confirmBackdrop') closeConfirm(); });
    document.getElementById('confirmNo').addEventListener('click', closeConfirm);
    document.getElementById('confirmYes').addEventListener('click', function(){
      if(pendingConfirm === 'new-order') logOrderToDb();
      cart = {};
      cashValue = '';
      paymentMethod = 'cash';
      saveCart(cart);
      sheetOpen = false;
      closeConfirm();
      renderCashier();
    });
  }
  function closeConfirm(){ pendingConfirm=null; confirmRoot.innerHTML=''; renderSheet(); }

  function logOrderToDb(){
    var lines = MENU.filter(function(it){ return cart[it.id]>0; });
    if(lines.length===0) return;
    var total = cartTotal();
    var cashNum = parseFloat(cashValue);
    var hasCash = paymentMethod==='cash' && cashValue.trim()!=='' && !isNaN(cashNum);
    var orderData = {
      items: lines.map(function(it){ return { id: it.id, name: it.name, price: it.price, qty: cart[it.id] }; }),
      total: total,
      paymentMethod: paymentMethod,
      cash: hasCash ? cashNum : null,
      change: hasCash ? (cashNum-total) : null,
      createdAt: new Date().toISOString()
    };
    addOrder(orderData);
    sendToSheet(orderData);
    if(currentView === 'admin') renderAdmin();
  }

  function renderCashier(){ renderMenu(); renderBar(); renderSheet(); }

  cashierMain.addEventListener('click', function(e){
    var btn = e.target.closest('[data-add]');
    if(btn) addItem(btn.getAttribute('data-add'));
  });
  viewOrderBtn.addEventListener('click', function(){ sheetOpen=true; renderSheet(); });
  document.getElementById('clearBtn').addEventListener('click', function(){ openConfirm('clear'); });

  // ---------------- admin view ----------------
  // Deterrent-level access gate, not real security: a helper with cashier access can still open
  // dev tools and read the shared db directly if they really try. This just keeps a quick glance at
  // #admin from handing over totals/history to whoever is holding the cashier phone.
  var ADMIN_PIN = '2026';
  var ADMIN_UNLOCK_KEY = 'roka_admin_unlocked_v1';
  function isAdminUnlocked(){ try{ return sessionStorage.getItem(ADMIN_UNLOCK_KEY) === '1'; }catch(e){ return false; } }
  function setAdminUnlocked(){ try{ sessionStorage.setItem(ADMIN_UNLOCK_KEY, '1'); }catch(e){} }

  var adminMain = document.getElementById('adminMain');
  var adminOrders = [];

  function renderAdminGate(err){
    adminMain.innerHTML = '' +
      '<div class="pin-gate">' +
        '<h2>Admin — enter PIN</h2>' +
        '<p>This view has your sales totals and order history for this device. Enter the PIN to continue.</p>' +
        '<input id="adminPinInput" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="&bull;&bull;&bull;&bull;">' +
        '<div class="pin-err">' + (err ? 'Wrong PIN. Try again.' : '') + '</div>' +
        '<button type="button" id="adminPinGo">Unlock</button>' +
      '</div>';
    var input = document.getElementById('adminPinInput');
    function tryUnlock(){
      if(input.value === ADMIN_PIN){
        setAdminUnlocked();
        startAdminSubscription(); ensureAdminClock(); renderAdmin();
      } else {
        renderAdminGate(true);
      }
    }
    document.getElementById('adminPinGo').addEventListener('click', tryUnlock);
    input.addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });
    input.focus();
  }

  // No live subscription here — this is a static page with no backend, so "live" just means
  // re-reading localStorage. Re-read on every view switch and after every order logged.
  function startAdminSubscription(){
    adminOrders = loadOrders();
    renderAdmin();
  }
  function stopAdminSubscription(){ /* nothing to tear down — there's no connection */ }

  function fmtTime(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleString('en-PH', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
    }catch(e){ return ''; }
  }
  function dayKey(iso){
    try{
      var d = new Date(iso);
      var y = d.getFullYear(), m = ('0'+(d.getMonth()+1)).slice(-2), day = ('0'+d.getDate()).slice(-2);
      return y + '-' + m + '-' + day;
    }catch(e){ return 'unknown'; }
  }
  function todayKey(){ return dayKey(new Date().toISOString()); }
  function dayLabel(key){
    if(key === todayKey()) return 'Today';
    try{
      var parts = key.split('-');
      var d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
      return d.toLocaleDateString('en-PH', { month:'short', day:'numeric' });
    }catch(e){ return key; }
  }

  var adminSelectedDay = todayKey(); // defaults to today; 'all' shows every day
  var adminDayPinned = false; // true once the viewer taps a specific day tab; false tracks "today" live as the date rolls over
  var adminClockTimer = null;

  function ensureAdminClock(){
    if(adminClockTimer) return;
    // Cheap to check every minute; only re-renders when the local date has actually changed (midnight rollover).
    adminClockTimer = setInterval(function(){
      if(!adminDayPinned && adminSelectedDay !== todayKey()){
        adminSelectedDay = todayKey();
        renderAdmin();
      }
    }, 60000);
  }

  function renderAdmin(){
    adminOrders = loadOrders();

    // Group every order by local day, oldest problems aside — this list drives the day tabs and the Sales by Day table.
    var byDay = {}; // key -> { orders, revenue, cups }
    adminOrders.forEach(function(o){
      var key = dayKey(o.createdAt);
      if(!byDay[key]) byDay[key] = { orders:0, revenue:0, cups:0 };
      byDay[key].orders += 1;
      byDay[key].revenue += (typeof o.total==='number') ? o.total : 0;
      (o.items||[]).forEach(function(it){ byDay[key].cups += it.qty; });
    });
    var dayKeys = Object.keys(byDay).sort().reverse();
    if(adminOrders.length && dayKeys.indexOf(adminSelectedDay) === -1 && adminSelectedDay !== 'all'){
      adminSelectedDay = dayKeys[0]; // selected day has no data (e.g. a fresh "today" with no orders yet) — fall back once data exists
    }

    var scoped = adminSelectedDay === 'all' ? adminOrders : adminOrders.filter(function(o){ return dayKey(o.createdAt) === adminSelectedDay; });

    var orderCount = scoped.length;
    var revenue = 0, cashTotal = 0, changeTotal = 0, gcashRevenue = 0, cashRevenue = 0;
    var itemAgg = {};
    scoped.forEach(function(o){
      revenue += (typeof o.total === 'number') ? o.total : 0;
      if(typeof o.cash === 'number') cashTotal += o.cash;
      if(typeof o.change === 'number') changeTotal += o.change;
      if(o.paymentMethod === 'gcash') gcashRevenue += (typeof o.total==='number') ? o.total : 0;
      else cashRevenue += (typeof o.total==='number') ? o.total : 0;
      (o.items||[]).forEach(function(it){
        if(!itemAgg[it.id]) itemAgg[it.id] = { name: it.name, qty:0, revenue:0 };
        itemAgg[it.id].qty += it.qty;
        itemAgg[it.id].revenue += it.price * it.qty;
      });
    });

    var breakdown = Object.keys(itemAgg).map(function(id){ return itemAgg[id]; });
    breakdown.sort(function(a,b){ return b.qty - a.qty; });
    var maxQty = breakdown.length ? breakdown[0].qty : 0;

    // Day tabs: Today/each past day plus All
    var tabsHtml = '<div class="day-tabs">';
    dayKeys.forEach(function(k){
      tabsHtml += '<button type="button" class="day-tab' + (adminSelectedDay===k?' active':'') + '" data-day="' + esc(k) + '">' + esc(dayLabel(k)) + '</button>';
    });
    if(dayKeys.length > 1){
      tabsHtml += '<button type="button" class="day-tab' + (adminSelectedDay==='all'?' active':'') + '" data-day="all">All time</button>';
    }
    tabsHtml += '</div>';

    var exportLabel = adminSelectedDay==='all' ? 'All time' : dayLabel(adminSelectedDay);
    var exportHtml = '' +
      '<div class="export-row">' +
        '<button type="button" class="btn-export" id="exportCsvBtn" data-scope="' + esc(adminSelectedDay) + '">Download CSV &mdash; ' + esc(exportLabel) + '</button>' +
      '</div>';

    var statsHtml = '' +
      '<div class="stat-grid">' +
        '<div class="stat-card"><div class="label">Sales</div><div class="value num">' + peso(revenue) + '</div><div class="sub">' + orderCount + ' order' + (orderCount===1?'':'s') + '</div></div>' +
        '<div class="stat-card"><div class="label">Cups sold</div><div class="value num">' + breakdown.reduce(function(s,b){return s+b.qty;},0) + '</div><div class="sub">across ' + breakdown.length + ' item' + (breakdown.length===1?'':'s') + '</div></div>' +
        '<div class="stat-card"><div class="label">Cash sales</div><div class="value num">' + peso(cashRevenue) + '</div><div class="sub">received ' + peso(cashTotal) + ' · change ' + peso(changeTotal) + '</div></div>' +
        '<div class="stat-card"><div class="label">GCash sales</div><div class="value num">' + peso(gcashRevenue) + '</div><div class="sub">scan-to-pay orders</div></div>' +
      '</div>';

    var breakdownHtml = '';
    if(breakdown.length===0){
      breakdownHtml = '<div class="empty-log">No sales logged for this day yet.</div>';
    } else {
      breakdown.forEach(function(b){
        var pct = maxQty ? Math.round((b.qty/maxQty)*100) : 0;
        breakdownHtml += '' +
          '<div class="breakdown-row">' +
            '<div class="bname">' + esc(b.name) + '</div>' +
            '<div class="bbar-wrap"><div class="bbar" style="width:' + pct + '%"></div></div>' +
            '<div class="bqty num">' + b.qty + '</div>' +
            '<div class="brev num">' + peso(b.revenue) + '</div>' +
          '</div>';
      });
    }

    var logHtml = '';
    if(scoped.length===0){
      logHtml = '<div class="empty-log">Orders will show up here as soon as the cashier marks one done.</div>';
    } else {
      logHtml = '<div class="order-log">' + scoped.map(function(o){
        var itemsStr = (o.items||[]).map(function(it){ return it.qty + '× ' + esc(it.name); }).join(', ');
        var cashStr = o.paymentMethod === 'gcash'
          ? 'GCash'
          : (typeof o.cash==='number')
            ? ('Cash ' + peso(o.cash) + ' · Change ' + peso(o.change||0))
            : 'Payment not logged';
        return '' +
          '<div class="order-card">' +
            '<div class="oc-top"><span class="oc-time">' + fmtTime(o.createdAt) + '</span><span class="oc-total num">' + peso(o.total||0) + '</span></div>' +
            '<div class="oc-items">' + itemsStr + '</div>' +
            '<div class="oc-cash">' + cashStr + '</div>' +
          '</div>';
      }).join('') + '</div>';
    }

    var dayTableHtml = '';
    if(dayKeys.length === 0){
      dayTableHtml = '<div class="empty-log">No days logged yet.</div>';
    } else {
      dayTableHtml = '<div class="order-log">' + dayKeys.map(function(k){
        var d = byDay[k];
        return '' +
          '<button type="button" class="day-row" data-day="' + esc(k) + '">' +
            '<span class="dr-date">' + esc(dayLabel(k)) + '</span>' +
            '<span class="dr-sub">' + d.orders + ' order' + (d.orders===1?'':'s') + ' · ' + d.cups + ' cup' + (d.cups===1?'':'s') + '</span>' +
            '<span class="dr-total num">' + peso(d.revenue) + '</span>' +
          '</button>';
      }).join('') + '</div>';
    }

    adminMain.innerHTML = '' +
      '<h2 style="font-size:20px">Live sales</h2>' +
      tabsHtml +
      exportHtml +
      statsHtml +
      '<div class="admin-section"><div class="section-title">Item breakdown — ' + esc(adminSelectedDay==='all' ? 'All time' : dayLabel(adminSelectedDay)) + '</div>' + breakdownHtml + '</div>' +
      '<div class="admin-section"><div class="section-title">Order log — ' + esc(adminSelectedDay==='all' ? 'All time' : dayLabel(adminSelectedDay)) + '</div>' + logHtml + '</div>' +
      '<div class="admin-section"><div class="section-title">Sales by day</div>' + dayTableHtml + '</div>';

    adminMain.querySelectorAll('[data-day]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var day = btn.getAttribute('data-day');
        adminSelectedDay = day;
        adminDayPinned = (day !== todayKey()); // tapping back onto today's own tab resumes live tracking
        renderAdmin();
      });
    });

    var exportBtn = document.getElementById('exportCsvBtn');
    if(exportBtn) exportBtn.addEventListener('click', function(){ exportCsv(scoped, adminSelectedDay); });
  }

  function csvEscape(v){
    var s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? ('"' + s.replace(/"/g,'""') + '"') : s;
  }
  function exportCsv(orders, scopeKey){
    // One column per menu item (quantity ordered), in menu order, plus date/time/totals around it.
    var header = ['Date','Time'].concat(MENU.map(function(it){ return it.name; })).concat(['Total','Payment','Cash Received','Change']);
    var rows = [header];
    var sorted = orders.slice().sort(function(a,b){ return new Date(a.createdAt) - new Date(b.createdAt); });
    var totals = MENU.map(function(){ return 0; }); // running qty total per item, for a summary row at the bottom

    sorted.forEach(function(o){
      var d = new Date(o.createdAt);
      var dateStr = isNaN(d) ? '' : d.toLocaleDateString('en-PH', { year:'numeric', month:'2-digit', day:'2-digit' });
      var timeStr = isNaN(d) ? '' : d.toLocaleTimeString('en-PH', { hour:'2-digit', minute:'2-digit' });
      var qtyById = {};
      (o.items||[]).forEach(function(it){ qtyById[it.id] = it.qty; });
      var qtyCells = MENU.map(function(it, idx){
        var q = qtyById[it.id] || 0;
        totals[idx] += q;
        return q || '';
      });
      var payStr = o.paymentMethod === 'gcash' ? 'GCash' : 'Cash';
      var row = [dateStr, timeStr].concat(qtyCells).concat([o.total||0, payStr, (typeof o.cash==='number'?o.cash:''), (typeof o.change==='number'?o.change:'')]);
      rows.push(row);
    });

    // Summary row: total cups sold per item across the exported range.
    var summaryRow = ['', 'TOTAL CUPS'].concat(totals.map(function(t){ return t || ''; })).concat(['', '', '', '']);
    rows.push(summaryRow);

    var csv = rows.map(function(r){ return r.map(csvEscape).join(','); }).join('\r\n');
    var fname = 'roka-sales-' + (scopeKey==='all' ? 'all-time' : scopeKey) + '.csv';
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  // ---------------- view switching (hash-based, no reload) ----------------
  var currentView = 'cashier';
  var brandSub = document.getElementById('brandSub');
  var navLink = document.getElementById('navLink');
  var clearBtn = document.getElementById('clearBtn');
  var orderBar = document.getElementById('orderBar');
  var cashierMainEl = document.getElementById('cashierMain');
  var adminMainEl = document.getElementById('adminMain');

  function applyView(){
    var isAdmin = location.hash === '#admin';
    currentView = isAdmin ? 'admin' : 'cashier';
    cashierMainEl.hidden = isAdmin;
    adminMainEl.hidden = !isAdmin;
    orderBar.hidden = isAdmin;
    clearBtn.hidden = isAdmin;
    navLink.href = isAdmin ? '#' : '#admin';
    navLink.textContent = isAdmin ? 'Cashier view' : 'Admin view';
    brandSub.textContent = isAdmin ? 'Admin — Live Sales' : 'Pop-Up Cashier';
    if(isAdmin){
      if(isAdminUnlocked()){ startAdminSubscription(); ensureAdminClock(); renderAdmin(); }
      else { stopAdminSubscription(); renderAdminGate(false); }
    }
    else { stopAdminSubscription(); }
  }
  window.addEventListener('hashchange', applyView);

  renderCashier();
  applyView();
})();
</script>
</body>
</html>
